# Equal-memory profile: the A100 limited to the RTX 4090's memory budget (0.92 x 24 GB = 22 GiB), so
# 8B weights leave ~5 GiB of KV as on the 4090. Same GPU and arrivals as 'a100'; only memory differs.
# The memory-pressure claims (coordination, drafter parking) are tested here, with 3 repeats.
name: a100-22gb
max_model_len: 16384
repeats: 3
wandb_project: iitj-coopt-a100-22gb
server_args: [--gpu-memory-utilization, 0.28]
arrival_time_scale: 1.4
