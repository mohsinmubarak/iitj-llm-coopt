# B2: vLLM native KV offloading to CPU (24 GiB buffer), no spec decoding.
# 24 GiB (was 32): vLLM puts the buffer in /dev/shm, which holds 28.6 GiB on the second 4090 pod.
name: vllm-cpu-kv-offload
description: vLLM native CPU KV offload (24 GiB)
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  args: [--dtype, bfloat16, --seed, 0, --kv-offloading-backend, native, --kv-offloading-size, 24]
runs:
  - workload: chat
    request_rates: [1, 4, 16, inf]
  - workload: long-context
    request_rates: [inf]
    max_concurrency: 16
  - workload: mixed-bursty
    arrivals: file
  - workload: phase-shift          # L3 phase shift: chat -> long -> burst -> recovery
    arrivals: file
