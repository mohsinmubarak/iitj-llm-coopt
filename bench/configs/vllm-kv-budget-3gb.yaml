# B2-S: memory-pressure sweep: fixed 3 GiB KV budget x concurrency {16,32,64,128} on W3.
# Maps where stock vLLM starts preempting / queueing (H1).
# Budgets must hold one max-length sequence (16K tokens x 128 KB = 2 GiB on the 4090 profile;
# 4 GiB at 32K on the A100). 4090 sweep: 2.5 / 3 / 4 GiB (stock vLLM gets ~5 GiB = 40.6K tokens).
name: vllm-kv-budget-3gb
description: "Memory-pressure sweep, KV budget 3 GiB"
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  args: [--dtype, bfloat16, --seed, 0, --kv-cache-memory-bytes, 3221225472]
runs:
  - workload: mixed-bursty
    label: mixed-bursty_concurrency16
    request_rates: [inf]
    max_concurrency: 16
  - workload: mixed-bursty
    label: mixed-bursty_concurrency32
    request_rates: [inf]
    max_concurrency: 32
  - workload: mixed-bursty
    label: mixed-bursty_concurrency64
    request_rates: [inf]
    max_concurrency: 64
  - workload: mixed-bursty
    label: mixed-bursty_concurrency128
    request_rates: [inf]
    max_concurrency: 128
