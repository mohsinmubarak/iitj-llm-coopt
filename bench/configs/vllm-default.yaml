# A2: stock vLLM, defaults (BF16, CUDA graphs, chunked prefill, prefix caching; no spec decoding, no offload).
# Context length and GPU memory come from the hardware profile.
name: vllm-default
description: Stock vLLM production floor (defaults, no tuning)
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  args: [--dtype, bfloat16, --seed, 0]
runs:
  - workload: chat
    request_rates: [1, 4, 16, inf]
  - workload: long-context
    request_rates: [inf]
    max_concurrency: 16
  - workload: mixed-bursty
    arrivals: file
  - workload: phase-shift          # L3 phase shift: chat -> long -> burst -> recovery
    arrivals: file
