# C6: same three controllers, independent (no shared snapshot, staggered clocks)
name: C6
description: "C6: same three controllers, independent (no shared snapshot, staggered clocks)"
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  cmd: [python, -m, engine.server, --model, unsloth/Meta-Llama-3.1-8B-Instruct, --draft, unsloth/Llama-3.2-1B-Instruct]
  args: [--seed, 0, --gamma, 4, --trace, "{out_dir}/trace.jsonl", --policy, coopt, --controllers, 'gamma,kv,sched', --kv-cpu-gb, 32, --independent]
runs:
  - workload: W1
    request_rates: [1, 4, 16, inf]
  - workload: W2
    request_rates: [inf]
    max_concurrency: 16
  - workload: W3
    arrivals: file
  - workload: W4          # L3 phase shift: chat -> long -> burst -> recovery
    arrivals: file
