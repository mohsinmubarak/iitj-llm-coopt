# B1-D: like-for-like spec baseline (same 1B drafter as our engine), fixed gamma=4
name: vllm-draft-spec-gamma4
description: "B1-D: like-for-like spec baseline (same 1B drafter as our engine), fixed gamma=4"
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  args: [--dtype, bfloat16, --seed, 0, --speculative-config, '{"method": "draft_model", "model": "unsloth/Llama-3.2-1B-Instruct", "num_speculative_tokens": 4}']
runs:
  - workload: chat
    request_rates: [1, 4, 16, inf]
  - workload: long-context
    request_rates: [inf]
    max_concurrency: 16
  - workload: mixed-bursty
    arrivals: file
  - workload: phase-shift          # L3 phase shift: chat -> long -> burst -> recovery
    arrivals: file
