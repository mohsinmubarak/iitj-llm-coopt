# B1-S: fixed-gamma sweep with the 1B drafter, gamma=2
name: B1D_g2
description: "B1-S: fixed-gamma sweep with the 1B drafter, gamma=2"
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  args: [--dtype, bfloat16, --seed, 0, --speculative-config, '{"method": "draft_model", "model": "unsloth/Llama-3.2-1B-Instruct", "num_speculative_tokens": 2}']
runs:
  - workload: W1
    request_rates: [1, 4, 16, inf]
  - workload: W2
    request_rates: [inf]
    max_concurrency: 16
