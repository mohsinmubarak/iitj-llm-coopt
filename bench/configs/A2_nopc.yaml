# A2-noPC: stock vLLM with prefix caching disabled. Our engine has no prefix cache, so this is the
# like-for-like engine baseline; A2 vs A2_nopc measures what prefix caching is worth, in particular
# in W4's burst phase, where vLLM's preempted requests re-enter almost for free from cached blocks.
name: A2_nopc
description: "Stock vLLM, prefix caching off (like-for-like with our engine)"
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  args: [--dtype, bfloat16, --seed, 0, --no-enable-prefix-caching]
runs:
  - workload: W1
    request_rates: [1, 4, 16, inf]
  - workload: W2
    request_rates: [inf]
    max_concurrency: 16
  - workload: W3
    arrivals: file
  - workload: W4
    arrivals: file
