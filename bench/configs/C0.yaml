# C0: our engine, all controllers frozen (gamma=4, FCFS, recompute on preemption)
name: C0
description: "C0: our engine, all controllers frozen (gamma=4, FCFS, recompute on preemption)"
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  cmd: [python, -m, engine.server, --model, unsloth/Meta-Llama-3.1-8B-Instruct, --draft, unsloth/Llama-3.2-1B-Instruct]
  args: [--seed, 0, --gamma, 4, --trace, "{out_dir}/trace.jsonl", --policy, static]
runs:
  - workload: W1
    request_rates: [1, 4, 16, inf]
  - workload: W2
    request_rates: [inf]
    max_concurrency: 16
  - workload: W3
    arrivals: file
  - workload: W4          # L3 phase shift: chat -> long -> burst -> recovery
    arrivals: file
