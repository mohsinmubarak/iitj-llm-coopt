# C5: KV + scheduler, shared snapshot
name: ours-kv-and-scheduler
description: "C5: KV + scheduler, shared snapshot"
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  cmd: [python, -m, engine.server, --model, unsloth/Meta-Llama-3.1-8B-Instruct, --draft, unsloth/Llama-3.2-1B-Instruct]
  args: [--seed, 0, --gamma, 4, --trace, "{out_dir}/trace.jsonl", --policy, coopt, --controllers, 'kv,sched', --kv-cpu-gb, 32]
runs:
  - workload: mixed-bursty
    arrivals: file
