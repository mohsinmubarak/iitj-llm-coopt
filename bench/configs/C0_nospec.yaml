# C0-noSpec (E2): our engine without a draft model (gamma = 0), static policy.
# Compared with A2 (stock vLLM, no speculation) it isolates engine efficiency from speculation:
# same model, same attention kernel, same 2,048-token prefill chunk, no drafter memory or compute.
name: C0_nospec
description: "C0-noSpec: our engine, no draft model, static policy (engine-vs-vLLM baseline)"
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  cmd: [python, -m, engine.server, --model, unsloth/Meta-Llama-3.1-8B-Instruct]
  args: [--seed, 0, --gamma, 0, --trace, "{out_dir}/trace.jsonl", --policy, static]
runs:
  - workload: W1
    request_rates: [1, 4, 16, inf]
  - workload: W2
    request_rates: [inf]
    max_concurrency: 16
  - workload: W3
    arrivals: file
  - workload: W4          # L3 phase shift: chat -> long -> burst -> recovery
    arrivals: file
