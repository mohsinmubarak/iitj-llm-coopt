# A3: context-length scaling of stock vLLM: fixed-length prompts, 128 output tokens, 8 concurrent.
name: A3
description: Throughput vs prompt length on stock vLLM (motivation, H1)
server:
  model: unsloth/Meta-Llama-3.1-8B-Instruct
  args: [--dtype, bfloat16, --seed, 0]
runs:
  - workload: fixed_1024
    request_rates: [inf]
    max_concurrency: 8
  - workload: fixed_4096
    request_rates: [inf]
    max_concurrency: 8
  - workload: fixed_8192
    request_rates: [inf]
    max_concurrency: 8
  - workload: fixed_16384
    request_rates: [inf]
    max_concurrency: 8
  - workload: fixed_31744
    request_rates: [inf]
    max_concurrency: 8
